name: Encrypt validated OpenAI secret for AI Counselor SDK Railway volume
on:
  push:
    branches: [main]
    paths: [".github/workflows/encrypt-openai-for-counselor-sdk.yml"]
  workflow_dispatch:
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt existing validated OpenAI secret without exposing plaintext
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENAI_API_KEY:-}" == sk-* ]]
          echo "::add-mask::$OPENAI_API_KEY"
          cat > /tmp/railway-key.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
                    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnFjX3QMJoCFxivgvSZt+
                    nn+celDRKfYMH1kD+iZPd4mk0/srOQDoGTP12rtpb4Eb9T2+isJKSHCPV6fFHd2c
                    esONza5jQccCExu5b9Vap8qZ/8kmVGRAVRM2JbMmTvHJIgH/czJbtqvHlWDEE2Df
                    /SEPY954HSY/CmIAZMnXNKJfWM+P/shgK0oxDveLBiR0qPbGp9pMfOFf9ZDkSPFC
                    SDPgGE+H7pAlwJfXb3+2duSKEUVJF0ra0wyZZF8EMj+aQmbfU+lTChUbYB6+nKzj
                    HQOBclrLWWeqBGmPMTEN9hfSXgC0ZnmPm3X9uyVimn7CQ7Fil6jp98aGaFW1lFJ2
                    wwIDAQAB
                    -----END PUBLIC KEY-----
          KEY
          CIPHER="$(printf '%s' "$OPENAI_API_KEY" | openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-key.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha1 | base64 -w 0)"
          OPENAI_API_KEY=''
          echo "SDK_OPENAI_CIPHERTEXT_B64=$CIPHER"
          echo "ENCRYPTED_SDK_HANDOFF_READY"
