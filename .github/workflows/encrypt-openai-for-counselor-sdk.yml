name: Encrypt validated OpenAI secret for AI Counselor SDK Railway volume
on:
  push:
    branches: [main]
    paths: [".github/workflows/encrypt-openai-for-counselor-sdk.yml"]
  workflow_dispatch:
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Encrypt OpenAI key for SDK volume-held public RSA key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SDK_BASE_URL: https://ai-counselor-sdk-production.up.railway.app
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENAI_API_KEY:-}" == sk-* ]]
          echo "::add-mask::$OPENAI_API_KEY"
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$SDK_BASE_URL/internal/bootstrap/public-key" -o /tmp/sdk-public.json 2>/dev/null; then
              if python3 -c 'import json; x=json.load(open("/tmp/sdk-public.json")); assert x["algorithm"]=="RSA-OAEP-SHA256"; assert x["publicKey"].startswith("-----BEGIN PUBLIC KEY-----"); open("/tmp/sdk-public.pem","w").write(x["publicKey"])' 2>/dev/null; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          test "$READY" -eq 1
          CIPHER="$(printf '%s' "$OPENAI_API_KEY" | openssl pkeyutl -encrypt -pubin -inkey /tmp/sdk-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 | base64 -w 0)"
          OPENAI_API_KEY=''
          echo "SDK_OPENAI_RSA256_CIPHERTEXT_B64=$CIPHER"
          echo "SDK_RSA256_ENCRYPTED_HANDOFF_READY"
