name: Deploy AI WebRTC Participant to Fly

on:
  push:
    branches:
      - main
    paths:
      - "ai_participant/**"
      - ".github/workflows/deploy-ai-participant-fly.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: Fly app name
        required: false
        default: ai-unni-participant
      org_slug:
        description: Fly organization slug (optional)
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve Fly app
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INPUT_APP: ${{ github.event.inputs.app_name || 'ai-unni-participant' }}
          INPUT_ORG: ${{ github.event.inputs.org_slug || '' }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          APP="${INPUT_APP:-ai-unni-participant}"
          ORG="${INPUT_ORG:-personal}"
          if ! flyctl status -a "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "$ORG"
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Deploy client worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.fly.outputs.app }}
        run: flyctl deploy --remote-only --app "$APP" --config ai_participant/fly.toml

      - name: Show process status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.fly.outputs.app }}
        run: flyctl status -a "$APP"

      - name: Show startup logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.fly.outputs.app }}
        run: |
          set +e
          timeout 10s flyctl logs -a "$APP"
          exit 0
