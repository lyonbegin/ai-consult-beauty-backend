name: Check deployed WebRTC source map recovery read-only
on:
  push:
    branches: [investigate/webrtc-new-deployment-origin-20261103]
    paths: [.github/workflows/check-webrtc-source-maps-20261103.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check sourceContent presence without disclosing code
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a webrtc-new --machine 08016e5c9415d8 -C 'node -e "const f=require(\"fs\");for(const p of [\"/app/dist/auth/auth.controller.js.map\",\"/app/dist/realtime/session.service.js.map\"]){const j=JSON.parse(f.readFileSync(p));console.log(p,j.sources,Array.isArray(j.sourcesContent)?j.sourcesContent.map(s=>s?.length):\"NO_SOURCES_CONTENT\")}"'
