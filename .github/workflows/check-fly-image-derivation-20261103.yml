name: Validate existing webrtc-new Docker image as safe patch base
on:
  push:
    branches: [investigate/webrtc-new-deployment-origin-20261103]
    paths: [.github/workflows/check-fly-image-derivation-20261103.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate to own Fly registry without printing key
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin >/dev/null
      - name: Read own existing image and module metadata only
        run: |
          docker pull registry.fly.io/webrtc-new:deployment-01M1D15RJKAMGQPNF45Y1FHQYC
          docker run --rm --entrypoint /usr/local/bin/node registry.fly.io/webrtc-new:deployment-01M1D15RJKAMGQPNF45Y1FHQYC -e 'const m=require("/app/dist/app.module.js"); console.log("Original AppModule exists:",Boolean(m.AppModule));const s=require("/app/dist/realtime/session.service.js");console.log("Original SessionService exists:",Boolean(s.SessionService));'
      - run: docker logout registry.fly.io
