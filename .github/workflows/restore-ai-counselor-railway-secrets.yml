name: Restore AI Counselor Railway encrypted credentials

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-ai-counselor-railway-secrets.yml"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore encrypted credentials after compatible runtime is live
        env:
          RUNTIME_URL: https://ai-counselor-runtime-production-9fa8.up.railway.app
          OPENAI_CIPHERTEXT_B64: ""
          WEBRTC_CIPHERTEXT_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          json_body() {
            printf '%s' "$1" | python3 -c 'import json,sys; print(json.dumps({"ciphertext":sys.stdin.read()}))'
          }

          for attempt in $(seq 1 60); do
            echo "restore attempt $attempt"

            OPENAI_STATUS="$(curl -sS -o /tmp/openai.out -w '%{http_code}'               -H 'content-type: application/json'               --data-binary "$(json_body "$OPENAI_CIPHERTEXT_B64")"               "$RUNTIME_URL/internal/bootstrap/openai" || true)"

            WEBRTC_STATUS="$(curl -sS -o /tmp/webrtc.out -w '%{http_code}'               -H 'content-type: application/json'               --data-binary "$(json_body "$WEBRTC_CIPHERTEXT_B64")"               "$RUNTIME_URL/internal/bootstrap/webrtc" || true)"

            HEALTH="$(curl -sS "$RUNTIME_URL/health" || true)"
            echo "openai_http=$OPENAI_STATUS webrtc_http=$WEBRTC_STATUS health=$HEALTH"

            if printf '%s' "$HEALTH" | grep -q '"openaiConfigured":true'               && printf '%s' "$HEALTH" | grep -q '"webrtcKeyConfigured":true'; then
              echo "RAILWAY_CREDENTIAL_RESTORE_OK"
              exit 0
            fi
            sleep 5
          done
          echo "Credential restore did not become ready within retry window" >&2
          exit 1
