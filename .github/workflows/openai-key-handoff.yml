name: Temporary encrypted OpenAI key handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openai-key-handoff.yml"
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt GitHub OpenAI secret and hand it directly to Railway
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUNTIME_URL: https://ai-counselor-runtime-production-9fa8.up.railway.app
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          cat > /tmp/handoff-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnFjX3QMJoCFxivgvSZt+
          nn+celDRKfYMH1kD+iZPd4mk0/srOQDoGTP12rtpb4Eb9T2+isJKSHCPV6fFHd2c
          esONza5jQccCExu5b9Vap8qZ/8kmVGRAVRM2JbMmTvHJIgH/czJbtqvHlWDEE2Df
          /SEPY954HSY/CmIAZMnXNKJfWM+P/shgK0oxDveLBiR0qPbGp9pMfOFf9ZDkSPFC
          SDPgGE+H7pAlwJfXb3+2duSKEUVJF0ra0wyZZF8EMj+aQmbfU+lTChUbYB6+nKzj
          HQOBclrLWWeqBGmPMTEN9hfSXgC0ZnmPm3X9uyVimn7CQ7Fil6jp98aGaFW1lFJ2
          wwIDAQAB
          -----END PUBLIC KEY-----
          KEY
          CIPHERTEXT="$(printf '%s' "$OPENAI_API_KEY" | openssl pkeyutl -encrypt -pubin -inkey /tmp/handoff-public.pem -pkeyopt rsa_padding_mode:oaep | base64 -w 0)"
          BODY="$(printf '%s' "$CIPHERTEXT" | python3 -c 'import json,sys; print(json.dumps({"ciphertext":sys.stdin.read()}))')"
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors             -H 'content-type: application/json' --data-binary "$BODY"             "$RUNTIME_URL/internal/bootstrap/openai"
          echo
          curl --fail --silent --show-error "$RUNTIME_URL/health" | grep -q '"openaiConfigured":true'
          echo "OPENAI_HANDOFF_OK"
